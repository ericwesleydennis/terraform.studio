<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terraform · Weaver Studios</title>
<meta name="description" content="Terraform: modular 3D terrain for tabletop roleplaying games, by Weaver Studios. Coming soon.">
<link rel="icon" href="img/logo/terraform-symbol-teal.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* holding page while the full landing page (and its sign-up form) waits on Netlify (15 Nov 2026) */
  :root{--ground:#0B1214;--ink:#E8EEEC;--muted:#8FA3A0;--teal:#3BD9B2;--tan:#C8B48E}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--ground);color:var(--ink);font-family:Manrope,system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px;
    background-image:radial-gradient(circle at 50% 50%, rgba(200,180,142,.10) 1.6px, transparent 2px),radial-gradient(ellipse at 50% 40%, rgba(59,217,178,.10), transparent 60%);
    background-size:25px 25px,100% 100%}
  main{text-align:center;max-width:560px}
  .mark{width:min(320px,80vw);height:auto;display:block;margin:0 auto 28px}
  h1{font-family:Jost,system-ui,sans-serif;font-weight:600;letter-spacing:.24em;text-transform:uppercase;font-size:clamp(1.1rem,3.6vw,1.5rem);margin:0 0 12px;color:var(--teal)}
  p{color:var(--muted);line-height:1.6;margin:0 0 8px}
  footer{margin-top:40px;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:.85rem}
  footer img{width:22px;height:22px;opacity:.85}
</style>
</head>
<body>
<main>
  <img class="mark" src="img/logo/terraform-wordmark-white.png" alt="Terraform">
  <h1>Coming soon</h1>
  <p>Modular 3D terrain for your tabletop adventures. Build the world your players walk through, one square at a time.</p>
  <footer><img src="img/logo/weaver-triquetra-symbol-white.png" alt="">A Weaver Studios product</footer>
</main>
</body>
</html>
